<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StageReady Speaker Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link id="bootstrap-rtl" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet" disabled>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>


<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5">
    <!-- Theme & RTL Toggles (Top Right) -->
    <div class="position-fixed top-0 end-0 p-3 d-flex gap-2 z-3">
        <button class="btn-nav-outline shadow-sm" id="rtl-toggle" title="Toggle RTL/LTR">RTL</button>
        <button class="btn-nav-outline shadow-sm" id="theme-toggle" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card rounded-0 border-0 p-4 bg-white shadow-lg">
                    <div class="text-center mb-3">
                        <a href="index.html" class="d-inline-flex align-items-center mb-4">
                            <img src="assets/img/weblogo.svg" alt="StageReady" width="170" height="40">
                        </a>
                        <h3 class="fw-bold mb-0">Welcome Back</h3>
                    </div>

                    <form action="dashboard.html" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Email Address</label>
                            <input type="email" class="form-control rounded-0" required>
                            <div class="invalid-feedback">A valid email is required.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Password</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-control rounded-0" required>
                                <span class="password-toggle-icon">
                                    <i class="bi bi-eye-fill"></i>
                                </span>
                            </div>
                            <div class="invalid-feedback">Password is required.</div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="text-red small text-decoration-none">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn-red w-100 py-3 mb-4">Login to Dashboard</button>

                        <div class="row g-2">
                            <div class="col-6">
                                <button type="button"
                                    class="btn btn-outline border-dark rounded-0 d-flex align-items-center justify-content-center gap-2 w-100 small px-2">
                                    <i class="bi bi-google"></i> Google
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button"
                                    class="btn btn-outline border-dark rounded-0 d-flex align-items-center justify-content-center gap-2 w-100 small px-2">
                                    <i class="bi bi-linkedin"></i> LinkedIn
                                </button>
                            </div>
                        </div>

                        <div class="mt-5 text-center">
                            <p class="small text-secondary mb-0">Don't have an account? <a href="register.html"
                                    class="text-red fw-bold">Apply for StageReady</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
    <script src="assets/js/main.js"></script>
</body>

</html>
