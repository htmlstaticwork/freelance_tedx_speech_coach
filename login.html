<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StageReady Speaker Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link id="bootstrap-rtl" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet" disabled>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dark-mode.css"><link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-black vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card rounded-0 border-0 p-5 bg-white shadow-lg">
                    <div class="text-center mb-5">
                        <a href="index.html" class="d-inline-flex align-items-center mb-4">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2"><circle cx="20" cy="20" r="18" stroke="#E62B1E" stroke-width="2"/><path d="M20 10V30M14 16L20 10L26 16" stroke="#E62B1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span class="fw-bold fs-4 ls-1 text-dark">StageReady</span>
                        </a>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-secondary small">Access your speaker war room.</p>
                    </div>

                    <form action="dashboard.html" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Email Address</label>
                            <input type="email" class="form-control rounded-0" placeholder="speaker@example.com" required>
                            <div class="invalid-feedback">A valid email is required.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase">Password</label>
                            <input type="password" class="form-control rounded-0" required>
                            <div class="invalid-feedback">Password is required.</div>
                        </div>
                        <button type="submit" class="btn-red w-100 py-3 mb-4">Login to Dashboard</button>
                        
                        <div class="text-center mb-4 position-relative">
                            <hr class="m-0"><span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-secondary">OR</span>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline border-dark rounded-0 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-google"></i> Login with Google
                            </button>
                        </div>

                        <div class="mt-5 text-center">
                            <p class="small text-secondary mb-0">Don't have an account? <a href="register.html" class="text-red fw-bold">Apply for StageReady</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
</body>
</html>
